[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["ws", "tokio", "http1", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.191"
qrcode = { version = "0.14.1", default-features = false }
regex = "1.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
whatsapp-rust = { version = "0.7.0", default-features = false, features = ["tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
whatsapp-rust-sqlite-storage = { version = "0.7.0", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full", "test-util"] }
