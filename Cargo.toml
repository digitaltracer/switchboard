[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["ws", "tokio", "http1", "json", "query"] }
base64 = "0.23.1"
bytes = "1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["client", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http2", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
libc = "0.2.191"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "std", "pem"] }
qrcode = { version = "0.14.1", default-features = false }
regex = "1.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "1.1.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "6.0.0", features = ["preserve_order", "preserve_path_order"] }
whatsapp-rust = { version = "0.7.0", default-features = false, features = ["tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
whatsapp-rust-sqlite-storage = { version = "0.7.0", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full", "test-util"] }
